<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Array Sorting</title>
</head>

<body>
    <h1>JavaScript Array Sorting</h1>
    <p>Click The Button To Sort The Array In Any Order</p>
    <button onclick="ascending()">ascending</button>
    <button onclick="descending()">descending</button>
    <p id="result"></p>

    <script>
        var points = [40,100,1,5,25,10];
        document.getElementById("result"). innerHTML = points;

      function ascending() {
        points.sort(function (a, b) {
            return a - b;
            
        });
document.getElementById("result").innerHTML = points;

    }


      
      function descending() {
              points.sort(function (a, b) {
                      return b - a;

                  });
         document.getElementById("result").innerHTML = points; 
         
         }


    </script>

</body>
</html>
